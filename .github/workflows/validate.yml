name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  plugin:
    name: Plugin manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # Install per https://code.claude.com/docs/en/setup.md (fetched 2026-11-03).
      # Installing needs no credentials; only sessions do. `plugin validate` runs offline.
      # Version pin is F10; 2.1.329 was npm latest on 2026-11-19.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.329
      - name: Validate plugin
        run: claude plugin validate . --strict

  names:
    name: No private names
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check public text for private names
        run: bash scripts/check-private-names.sh

  lessons-root:
    name: Lessons root helper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Test lessons-root.sh
        run: bash scripts/test-lessons-root.sh

  links:
    name: README links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check README links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress README.md
          fail: true
